# Privacy audit (T-024 criterion 5b): every commit in every push is scanned for personal data.
#
# EVERY commit, not the checked-out tip. A two-commit push can introduce a leak in the first
# commit and remove it in the second; auditing only HEAD passes while the forbidden value sits
# in remote history permanently. So the job enumerates the push range and runs the scanner's
# commit mode against each new commit individually.
#
# This is the DETECTION half of the T-024 enforcement boundary. The guarded-commit wrapper is
# the local half; it can be bypassed (--no-verify, direct git, other tools), and this workflow
# is what notices when it was.

name: privacy-audit

# `push` alone audits a fork's contribution only once it has been merged, which is after the
# decision it should inform (review round 1, chunk 15). `pull_request` closes that: the commits a
# PR proposes are scanned before anyone merges them. Neither trigger PREVENTS anything — a fork's
# own repository is beyond this workflow's reach, and the honest claim stays detection.
on:
  push:
  pull_request:

jobs:
  scan-pushed-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the push range below walks commits the shallow default would not have.
          fetch-depth: 0
          # For a pull_request the default checkout is the MERGE commit, whose history is not the
          # set of commits the PR introduces. The audit wants those, so it takes the head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan every commit in the push range
        env:
          # A pull_request has no `before`; its range is base..head, and that base is always
          # reachable, so the new-branch fallback never applies to it.
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -u
          # Range resolution lives in scripts/push-range.mjs, not here. A shell block inside a
          # workflow cannot be tested, and this one was wrong: `--exclude` matched the wrong
          # namespace and `--remotes` subtracted the branch that had just been pushed, so a
          # multi-commit push of a new branch collapsed to its tip (review round 1, chunk 15).
          # The script has its own tests and refuses to resolve an empty range.
          COMMITS=$(node scripts/push-range.mjs --before="$BEFORE" --after="$AFTER" --ref="$REF") || exit 2

          STATUS=0
          for sha in $COMMITS; do
            echo "::group::privacy-scan $sha"
            if ! node scripts/privacy-scan.mjs --mode=commit --rev="$sha"; then
              STATUS=1
            fi
            echo "::endgroup::"
          done
          exit $STATUS
